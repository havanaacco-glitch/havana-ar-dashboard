<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Havana — Accounts Receivable Executive Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--d:#050910;--b:#0A0F1E;--s:#0F1629;--e:#161D33;--h:#1C2540;--g:#D4A853;--gd:rgba(212,168,83,.12);--gb:rgba(212,168,83,.10);--gg:rgba(212,168,83,.22);--gn:#10B981;--gnd:rgba(16,185,129,.12);--rd:#EF4444;--rdd:rgba(239,68,68,.12);--bl:#3B82F6;--bld:rgba(59,130,246,.12);--am:#F59E0B;--amd:rgba(245,158,11,.12);--pu:#A855F7;--cy:#06B6D4;--t1:#F1F5F9;--t2:#94A3B8;--t3:#64748B;--t4:#475569;--bo:rgba(255,255,255,.05);--gl:rgba(255,255,255,.03);--r:16px;--r2:12px;--r3:8px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Cairo','Inter',sans-serif;background:var(--d);color:var(--t1);min-height:100vh}[dir=ltr] body{font-family:'Inter','Cairo',sans-serif}
::selection{background:rgba(212,168,83,.3)}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.15)}
/* Header */
.hdr{padding:12px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:rgba(10,15,30,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--gb);position:sticky;top:0;z-index:100}
.hdr-brand{display:flex;align-items:center;gap:12px}.hdr-brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--g),#B8860B);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--d)}.hdr-brand h1{font-size:16px;font-weight:800;color:var(--g);letter-spacing:1px}.hdr-brand span{font-size:8px;color:var(--t3);display:block;letter-spacing:2px;margin-top:1px}
.hdr-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:var(--r3);border:1px solid var(--bo);background:var(--gl);color:var(--t2);font-size:9px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;backdrop-filter:blur(8px)}.btn:hover{background:rgba(255,255,255,.07);color:var(--t1);border-color:rgba(255,255,255,.1)}.btn.gold{border-color:var(--gg);color:var(--g)}.btn.gold:hover{background:var(--gd)}
.lt{display:flex;border-radius:var(--r3);overflow:hidden;border:1px solid var(--gb)}.lt button{padding:4px 9px;border:0;background:var(--gl);color:var(--t3);font-size:9px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}.lt button.act{background:var(--gd);color:var(--g)}
select.fl{padding:4px 8px;border-radius:var(--r3);border:1px solid var(--bo);background:var(--s);color:var(--t1);font-size:9px;font-family:inherit;cursor:pointer}select.fl option{background:var(--s)}
/* Tabs */
.tabs{display:flex;gap:2px;padding:8px 24px;background:rgba(10,15,30,.6);border-bottom:1px solid var(--bo);overflow-x:auto}
.tab{padding:7px 16px;border-radius:var(--r3) var(--r3) 0 0;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--t3);font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}.tab:hover{color:var(--t2);background:var(--gl)}.tab.act{background:var(--gd);color:var(--g);border-color:var(--gb)}
/* Main */
.main{padding:16px 24px;max-width:1440px;margin:0 auto}
.sec{display:none;animation:fu .3s ease}.sec.act{display:block}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
/* Glass Card */
.gc{background:linear-gradient(135deg,rgba(15,22,41,.8),rgba(22,29,51,.6));border:1px solid var(--gb);border-radius:var(--r);padding:16px;margin-bottom:12px;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.gc::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
.gc.accent{background:linear-gradient(135deg,rgba(212,168,83,.05),rgba(15,22,41,.8));border-color:rgba(212,168,83,.15)}
.gc.alert-card{border-color:rgba(239,68,68,.2);background:linear-gradient(135deg,rgba(239,68,68,.04),rgba(15,22,41,.8))}
.gc-t{font-size:12px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.gc-t .bar{width:3px;height:14px;border-radius:2px;flex-shrink:0}
/* KPI Grid */
.kpi-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:linear-gradient(135deg,rgba(15,22,41,.9),rgba(22,29,51,.7));border:1px solid var(--gb);border-radius:var(--r2);padding:14px 16px;backdrop-filter:blur(8px);position:relative;overflow:hidden;transition:all .25s}
.kpi:hover{border-color:rgba(212,168,83,.25);transform:translateY(-1px)}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.kpi.green::after{background:var(--gn)}.kpi.red::after{background:var(--rd)}.kpi.blue::after{background:var(--bl)}.kpi.gold::after{background:var(--g)}.kpi.amber::after{background:var(--am)}.kpi.purple::after{background:var(--pu)}.kpi.cyan::after{background:var(--cy)}
.kpi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}.kpi-icon{font-size:18px;opacity:.8}.kpi-trend{font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px}
.kpi-trend.up{background:var(--gnd);color:var(--gn)}.kpi-trend.down{background:var(--rdd);color:var(--rd)}.kpi-trend.flat{background:rgba(148,163,184,.1);color:var(--t3)}
.kpi-val{font-size:20px;font-weight:800;margin-bottom:2px;font-feature-settings:'tnum'}.kpi-lbl{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:1px}
.kpi-spark{height:24px;margin-top:6px;opacity:.4}
/* Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
/* Branch Cards */
.br-card{background:linear-gradient(135deg,rgba(15,22,41,.9),rgba(22,29,51,.7));border:1px solid var(--gb);border-radius:var(--r2);padding:14px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.br-card:hover{border-color:rgba(212,168,83,.3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.br-card .rank{position:absolute;top:10px;font-size:20px;font-weight:900;color:rgba(212,168,83,.08)}
[dir=rtl] .br-card .rank{left:10px}[dir=ltr] .br-card .rank{right:10px}
.br-card .risk{display:inline-block;padding:2px 8px;border-radius:4px;font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.risk-high{background:var(--rdd);color:var(--rd)}.risk-med{background:var(--amd);color:var(--am)}.risk-low{background:var(--gnd);color:var(--gn)}
/* Tables */
.tbl-wrap{overflow-x:auto;max-height:480px;overflow-y:auto;border-radius:var(--r3)}.tbl{width:100%;border-collapse:separate;border-spacing:0 2px;min-width:700px}
.tbl thead th{text-align:inherit;padding:7px 10px;font-size:9px;color:var(--t3);font-weight:600;border-bottom:1px solid var(--bo);position:sticky;top:0;background:var(--s);z-index:5;cursor:pointer;transition:color .15s;user-select:none}.tbl thead th:hover{color:var(--g)}
.tbl tbody tr{transition:all .15s}.tbl tbody tr:nth-child(even){background:rgba(255,255,255,.01)}.tbl tbody tr:hover{background:rgba(212,168,83,.04)}
.tbl tbody td{padding:6px 10px;font-size:10px;vertical-align:middle}
/* Badges */
.bg{display:inline-block;padding:2px 8px;border-radius:4px;font-size:8px;font-weight:600;white-space:nowrap}
.bg-gn{background:var(--gnd);color:var(--gn)}.bg-rd{background:var(--rdd);color:var(--rd)}.bg-am{background:var(--amd);color:var(--am)}.bg-bl{background:var(--bld);color:var(--bl)}.bg-pu{background:rgba(168,85,247,.12);color:var(--pu)}.bg-cy{background:rgba(6,182,212,.12);color:var(--cy)}.bg-m{background:rgba(148,163,184,.08);color:var(--t3)}.bg-gd{background:var(--gd);color:var(--g)}
/* Progress */
.prog{height:5px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden;margin-top:3px}.prog-f{height:100%;border-radius:3px;transition:width .8s ease}
/* Alert */
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:rgba(255,255,255,.015);border-radius:var(--r3);margin-bottom:5px;border:1px solid var(--bo);transition:all .2s}.alert-item:hover{background:rgba(255,255,255,.03)}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}.alert-dot.critical{background:var(--rd)}.alert-dot.warning{background:var(--am)}.alert-dot.info{background:var(--bl)}
/* Search */
.search{width:100%;padding:8px 14px;border-radius:var(--r3);border:1px solid var(--bo);background:rgba(255,255,255,.02);color:var(--t1);font-size:11px;font-family:inherit;backdrop-filter:blur(4px);transition:border-color .2s}.search:focus{outline:none;border-color:var(--gg)}
/* Pagination */
.pag{display:flex;justify-content:center;align-items:center;gap:6px;padding:10px 0;font-size:10px}.pag button{padding:4px 10px;border-radius:5px;border:1px solid var(--bo);background:var(--gl);color:var(--t2);font-size:10px;cursor:pointer;font-family:inherit;transition:all .15s}.pag button:hover{background:rgba(255,255,255,.06)}.pag button.act{background:var(--gd);color:var(--g);border-color:var(--gg)}.pag button:disabled{opacity:.3;cursor:not-allowed}
/* Summary */
.ceo-sum{background:linear-gradient(135deg,rgba(212,168,83,.06),rgba(15,22,41,.9));border:1px solid rgba(212,168,83,.18);border-radius:var(--r);padding:18px 22px;margin-bottom:14px;position:relative;overflow:hidden}
.ceo-sum::before{content:'';position:absolute;top:0;width:180px;height:180px;background:radial-gradient(circle,rgba(212,168,83,.06),transparent 70%);pointer-events:none}[dir=rtl] .ceo-sum::before{right:-30px;top:-30px}[dir=ltr] .ceo-sum::before{left:-30px;top:-30px}
.ceo-sum .sum-badge{display:inline-block;font-size:7px;color:var(--g);font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:3px 10px;border-radius:4px;background:var(--gd);margin-bottom:8px}
.ceo-sum .sum-text{font-size:12px;color:var(--t2);line-height:1.9}
.ceo-sum .sum-text strong{color:var(--t1);font-weight:700}
/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}.modal-ov.vis{display:flex}
.modal{background:var(--e);border:1px solid var(--gb);border-radius:var(--r);padding:22px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:700;color:var(--g);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal .close{margin-inline-start:auto;cursor:pointer;font-size:14px;color:var(--t3);background:none;border:none;font-family:inherit}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--e);border:1px solid var(--gb);color:var(--t1);padding:8px 20px;border-radius:var(--r3);font-size:10px;font-weight:600;z-index:999;opacity:0;transition:all .35s;pointer-events:none;font-family:inherit;backdrop-filter:blur(12px)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Status */
.status-bar{display:flex;justify-content:center;align-items:center;gap:12px;padding:6px;font-size:8px;color:var(--t4);background:rgba(0,0,0,.3)}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block}.status-dot.on{background:var(--gn);box-shadow:0 0 6px var(--gn)}.status-dot.off{background:var(--rd)}
/* Aging */
.aging-bar{display:flex;height:28px;border-radius:var(--r3);overflow:hidden;margin:8px 0}.aging-seg{display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:white;transition:width .8s ease;min-width:1px}

/* Executive polish */
.exec-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 14px}
.exec-card{background:linear-gradient(135deg,rgba(212,168,83,.08),rgba(15,22,41,.86));border:1px solid rgba(212,168,83,.16);border-radius:18px;padding:14px 16px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.16)}
.exec-card:before{content:'';position:absolute;inset:-80px auto auto -60px;width:150px;height:150px;background:radial-gradient(circle,rgba(212,168,83,.12),transparent 65%)}
.exec-card .x-label{font-size:9px;color:var(--t3);letter-spacing:.7px;margin-bottom:5px;text-transform:uppercase}.exec-card .x-value{font-size:22px;font-weight:900;color:var(--t1);line-height:1.2}.exec-card .x-sub{font-size:9px;color:var(--t2);margin-top:5px;line-height:1.5}.exec-card.danger{border-color:rgba(239,68,68,.22);background:linear-gradient(135deg,rgba(239,68,68,.06),rgba(15,22,41,.86))}.exec-card.success{border-color:rgba(16,185,129,.22);background:linear-gradient(135deg,rgba(16,185,129,.06),rgba(15,22,41,.86))}.exec-card.info{border-color:rgba(59,130,246,.22);background:linear-gradient(135deg,rgba(59,130,246,.06),rgba(15,22,41,.86))}
.exec-two{display:grid;grid-template-columns:1.1fr .9fr;gap:10px;margin-bottom:12px}.heat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.heat-card{padding:10px;border-radius:12px;border:1px solid var(--bo);background:rgba(255,255,255,.018)}.heat-card .h-name{font-size:10px;font-weight:700;margin-bottom:4px}.heat-card .h-amt{font-size:13px;font-weight:900;color:var(--t1)}.heat-card .h-pct{font-size:8px;color:var(--t3);margin-top:3px}.heat-card.high{border-color:rgba(239,68,68,.28);box-shadow:inset 0 0 0 1px rgba(239,68,68,.08)}.heat-card.med{border-color:rgba(245,158,11,.28)}.heat-card.low{border-color:rgba(16,185,129,.20)}
.action-list{display:grid;gap:6px}.action-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.018);border:1px solid var(--bo)}.action-row:hover{background:rgba(212,168,83,.045)}.action-row .who{font-size:10px;font-weight:700;color:var(--t1);line-height:1.4}.action-row .meta{font-size:8px;color:var(--t3);margin-top:3px}.action-row .amount{font-size:12px;font-weight:900;color:var(--rd);white-space:nowrap}.pill{display:inline-block;padding:2px 7px;border-radius:999px;font-size:7px;font-weight:800;letter-spacing:.6px}.pill.critical{background:rgba(239,68,68,.14);color:var(--rd)}.pill.follow{background:rgba(245,158,11,.14);color:var(--am)}.pill.watch{background:rgba(59,130,246,.14);color:var(--bl)}
.data-note{border:1px dashed rgba(212,168,83,.22);background:rgba(212,168,83,.045);border-radius:14px;padding:10px 12px;font-size:10px;color:var(--t2);line-height:1.7;margin-bottom:12px}.data-note strong{color:var(--g)}
body.presentation .hdr,body.presentation .tabs,body.presentation .status-bar{display:none}body.presentation .main{max-width:1600px;padding:22px}body.presentation .gc,body.presentation .kpi,body.presentation .ceo-sum,body.presentation .exec-card{box-shadow:0 16px 50px rgba(0,0,0,.22)}
@media print{.hdr,.tabs,.status-bar,.btn,.modal-ov{display:none!important}body{background:#fff;color:#111}.main{max-width:none;padding:0}.gc,.kpi,.ceo-sum,.exec-card{break-inside:avoid;background:#fff!important;border:1px solid #ddd!important;color:#111!important}.tbl tbody td,.tbl thead th{color:#111!important}.kpi-val,.x-value{color:#111!important}}
@media(max-width:900px){.exec-two{grid-template-columns:1fr}}


/* Executive polish fixes */
html,body{overflow-x:hidden;}
#sec-overview .g2{align-items:stretch;}
#sec-overview .gc{min-height:300px;}
#sec-overview .gc canvas{display:block;width:100%!important;height:240px!important;max-height:240px!important;}
#sec-overview #cDist{height:210px!important;max-height:210px!important;}
#sec-overview #cAging{height:135px!important;max-height:135px!important;}
#sec-trends .gc canvas{display:block;width:100%!important;height:260px!important;max-height:260px!important;}
#sec-trends #cColl{height:220px!important;max-height:220px!important;}
.executive-trend-grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:10px;margin-bottom:12px;}
.trend-tile{background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--bo);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;}
.trend-tile:before{content:'';position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--g),transparent);opacity:.75;}
.trend-label{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.trend-value{font-size:20px;font-weight:900;color:var(--t1);}
.trend-sub{font-size:9px;color:var(--t3);margin-top:4px;line-height:1.6;}
.pro-note{border:1px solid rgba(212,168,83,.18);background:rgba(212,168,83,.055);color:var(--t2);padding:10px 12px;border-radius:12px;font-size:10px;line-height:1.8;margin-bottom:12px;}
@media(max-width:900px){.executive-trend-grid{grid-template-columns:1fr 1fr}#sec-overview .gc canvas,#sec-trends .gc canvas{height:220px!important;max-height:220px!important}}
@media(max-width:600px){.executive-trend-grid{grid-template-columns:1fr}}


/* Google Drive loading and auto refresh polish */
.drive-loading{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,rgba(212,168,83,.10),rgba(5,9,16,.96) 42%,rgba(5,9,16,.99));backdrop-filter:blur(10px);transition:opacity .35s ease,visibility .35s ease}
.drive-loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
.drive-loading-card{width:min(520px,92vw);padding:30px 34px;border-radius:22px;background:linear-gradient(135deg,rgba(15,22,41,.94),rgba(22,29,51,.86));border:1px solid rgba(212,168,83,.22);box-shadow:0 28px 90px rgba(0,0,0,.45);text-align:center;position:relative;overflow:hidden}
.drive-loading-card:before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,transparent,var(--g),transparent);animation:driveGlow 1.6s linear infinite}
.drive-logo{width:54px;height:54px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,var(--g),#B8860B);display:flex;align-items:center;justify-content:center;color:var(--d);font-size:24px;font-weight:900;box-shadow:0 10px 30px rgba(212,168,83,.18)}
.drive-title{font-size:18px;font-weight:900;color:var(--t1);margin-bottom:6px}
.drive-sub{font-size:11px;color:var(--t2);line-height:1.8;margin-bottom:18px}
.drive-progress{height:6px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden}
.drive-progress span{display:block;height:100%;width:38%;border-radius:999px;background:linear-gradient(90deg,var(--g),#F6D365);animation:driveProgress 1.2s ease-in-out infinite}
.drive-foot{font-size:9px;color:var(--t3);margin-top:14px;letter-spacing:.4px}
@keyframes driveProgress{0%{transform:translateX(-130%)}100%{transform:translateX(280%)}}
@keyframes driveGlow{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.sync-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:rgba(16,185,129,.10);color:var(--gn);border:1px solid rgba(16,185,129,.18);font-weight:700}
.sync-pill .mini-dot{width:6px;height:6px;border-radius:50%;background:var(--gn);box-shadow:0 0 8px var(--gn)}
.sync-pill.refreshing{background:rgba(245,158,11,.10);color:var(--am);border-color:rgba(245,158,11,.18)}.sync-pill.refreshing .mini-dot{background:var(--am);box-shadow:0 0 8px var(--am);animation:blink 1s infinite}
.sync-pill.failed{background:rgba(239,68,68,.10);color:var(--rd);border-color:rgba(239,68,68,.18)}.sync-pill.failed .mini-dot{background:var(--rd);box-shadow:0 0 8px var(--rd)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
/* Auto Refresh Control */
.ar-ctrl{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r3);border:1px solid var(--bo);background:var(--gl);font-size:8px;color:var(--t3)}

function setLoadingState(show, title, sub, isError){
  const ov=document.getElementById('driveLoading');
  const ttl=document.getElementById('driveLoadingTitle');
  const st=document.getElementById('driveLoadingSub');
  const errDiv=document.getElementById('driveError');
  const progBar=document.getElementById('driveProgressBar');

  if(errDiv) errDiv.classList.toggle('vis', !!isError);
  if(progBar) progBar.style.display=isError?'none':'block';

    const errMsg=document.getElementById('driveErrMsg');

  }
  if(ov) ov.classList.toggle('hidden', !show);
}

function scheduleAutoRefresh(){
  stopCountdown();
  if(!AUTO_REFRESH_ON) return;
  COUNTDOWN_SEC=600;
  COUNTDOWN_TIMER=setInterval(()=>{
    COUNTDOWN_SEC--;
    updateCountdownDisplay();
    if(COUNTDOWN_SEC<=0){
      COUNTDOWN_SEC=600;
      refreshData(true);
    }
  },1000);
  updateCountdownDisplay();
}

function stopCountdown(){
  if(COUNTDOWN_TIMER){clearInterval(COUNTDOWN_TIMER);COUNTDOWN_TIMER=null;}
}

function toggleAutoRefresh(){
  AUTO_REFRESH_ON=!AUTO_REFRESH_ON;
  const btn=document.getElementById('arToggle');
  const label=document.getElementById('arLabel');
  const cd=document.getElementById('arCountdown');
  btn.classList.toggle('on',AUTO_REFRESH_ON);
  if(AUTO_REFRESH_ON){
    label.textContent=ia()?'تلقائي':'Auto';
    cd.classList.add('active');
    scheduleAutoRefresh();
    toast(ia()?'✅ التحديث التلقائي مفعّل':'✅ Auto refresh enabled');
  } else {
    stopCountdown();
    label.textContent=ia()?'متوقف':'Off';
    cd.textContent='--:--';
    cd.classList.remove('active');
    toast(ia()?'⏸ التحديث التلقائي متوقف':'⏸ Auto refresh paused');
  }
  updateStatus();
}

function updateCountdownDisplay(){
  const cd=document.getElementById('arCountdown');
  if(!cd) return;
  if(!AUTO_REFRESH_ON){cd.textContent='--:--';return;}
  const m=Math.floor(COUNTDOWN_SEC/60);
  const s=COUNTDOWN_SEC%60;
  cd.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

}

const BR=[{n:'المحجر',e:'Mahjar',c:'#2E7D32'},{n:'الستين',e:'Al-Siteen',c:'#1565C0'},{n:'جيزان',e:'Jazan',c:'#00838F'},{n:'خميس مشيط',e:'Khamis Mushait',c:'#4527A0'},{n:'النموذجية',e:'Namudhajiyah',c:'#1A237E'},{n:'البطحاء',e:'Al-Batha',c:'#004D40'},{n:'القصيم',e:'Qassim',c:'#BF360C'}];

function genDemo(){
  const names=['الطيب للتجارة','النور التجارية','الفجر للأقمشة','مؤسسة الصفا','الرياض للتوزيع','الأمل للملابس','الوطن للتجارة','دار الأناقة','البركة للأقمشة','الخليج التجارية','السلام للتوريدات','الفرسان للتجارة','الجزيرة للأقمشة','الحمد للملبوسات','النخبة التجارية','الأصالة للأقمشة','الرائد للتوزيع','الإبداع للأزياء','الثقة للتجارة','الماسة للأقمشة','القمة للتوريد','النجم للتجارة','الريادة للأقمشة','الإتقان التجارية','الشموخ للملابس','المنارة للأقمشة','الوفاء للتجارة','العروبة للنسيج','السعد للتوزيع','الشرق للأقمشة'];
  const custs=[];
  BR.forEach(br=>{const cnt=18+Math.floor(Math.random()*15);for(let i=0;i<cnt;i++){
    const nm=names[i%names.length]+(i>=names.length?' '+(Math.floor(i/names.length)+1):'');
    const db=Math.floor(Math.random()*95000)+2000;const cr0=Math.random();
    let cr,bal;if(cr0<.12){cr=db+Math.floor(Math.random()*8000);bal=db-cr;}else if(cr0<.22){cr=db;bal=0;}else{cr=Math.floor(db*(Math.random()*.65));bal=db-cr;}
    const ageBucket=Math.random();let aging;if(ageBucket<.35)aging='current';else if(ageBucket<.55)aging='1-30';else if(ageBucket<.72)aging='31-60';else if(ageBucket<.88)aging='61-90';else aging='90+';
    const daysSince=aging==='current'?Math.floor(Math.random()*15):aging==='1-30'?15+Math.floor(Math.random()*15):aging==='31-60'?30+Math.floor(Math.random()*30):aging==='61-90'?60+Math.floor(Math.random()*30):90+Math.floor(Math.random()*90);
    custs.push({Branch:br.n,Branch_En:br.e,BranchColor:br.c,Customer:nm,Debit:Math.round(db),Credit:Math.round(cr),Balance:Math.round(bal),Status:bal>0?'Debtor':bal<0?'Creditor':'Zero',Aging:aging,DaysSince:daysSince});
  }});
  const brs=BR.map(br=>{const bc=custs.filter(c=>c.Branch===br.n);return{branch:br.n,branchEn:br.e,color:br.c,debit:bc.reduce((s,c)=>s+c.Debit,0),credit:bc.reduce((s,c)=>s+c.Credit,0),balance:bc.reduce((s,c)=>s+c.Balance,0),customers:bc.length,debtors:bc.filter(c=>c.Status==='Debtor').length};});
  const top10=[...custs].filter(c=>c.Balance>0).sort((a,b)=>b.Balance-a.Balance).slice(0,10);
  const tD=custs.reduce((s,c)=>s+c.Debit,0),tC=custs.reduce((s,c)=>s+c.Credit,0);
  // Monthly trend (simulated 6 months)
  const months=ia()?['يناير','فبراير','مارس','أبريل','مايو','يونيو']:['Jan','Feb','Mar','Apr','May','Jun'];
  const trend=months.map((m,i)=>{const base=tD-tC;const factor=.7+Math.random()*.6;return{month:m,outstanding:Math.round(base*factor),collected:Math.round(base*factor*.6+Math.random()*base*.2),target:Math.round(base*factor*.75)};});
  return{customers:custs,branches:brs,top10,kpis:{'Total Debit':tD,'Total Credit':tC,'Net Outstanding':tD-tC,'Total Customers':custs.length,'Debtors':custs.filter(c=>c.Status==='Debtor').length,'Zero Balance':custs.filter(c=>c.Status==='Zero').length,'Creditors':custs.filter(c=>c.Status==='Creditor').length,'Last Updated':new Date().toISOString()},trend,timestamp:new Date().toISOString()};
}

function normalizeLiveData(data){
  const branchMeta={
    'Mahjar':{ar:'المحجر',en:'Mahjar',color:'#2E7D32'},
    'Siteen':{ar:'الستين',en:'Al-Siteen',color:'#1565C0'},
    'Jazan':{ar:'جيزان',en:'Jazan',color:'#00838F'},
    'Khamis':{ar:'خميس مشيط',en:'Khamis Mushait',color:'#4527A0'},
    'Namouzagya':{ar:'النموذجية',en:'Namouzagya',color:'#1A237E'},
    'Namozagya':{ar:'النموذجية',en:'Namozagya',color:'#1A237E'},
    'Batha':{ar:'البطحاء',en:'Al-Batha',color:'#004D40'},
    'Qassim':{ar:'القصيم',en:'Qassim',color:'#BF360C'}
  };
  data.customers=(data.customers||[]).map(c=>{
    const m=branchMeta[c.Branch]||{ar:c.Branch,en:c.Branch,color:'#D4A853'};
    return {
      ...c,
      Branch:c.Branch,
      Branch_En:c.Branch_En||m.en,
      BranchColor:c.BranchColor||m.color,
      Customer:c.Customer||c.customer||'',
      Debit:Number(c.Debit||c.debit||0),
      Credit:Number(c.Credit||c.credit||0),
      Balance:Number(c.Balance||c.balance||0),
      Status:c.Status || (Number(c.Balance||c.balance||0)>0?'Debtor':Number(c.Balance||c.balance||0)<0?'Creditor':'Zero'),
      Aging:c.Aging||'current',
      DaysSince:Number(c.DaysSince||0)
    };
  });
  data.branches=(data.branches||[]).map(b=>{
    const m=branchMeta[b.branch]||{ar:b.branch,en:b.branch,color:'#D4A853'};
    return {
      ...b,
      branch:b.branch,
      branchEn:b.branchEn||m.en,
      color:b.color||m.color,
      debit:Number(b.debit||0),
      credit:Number(b.credit||0),
      balance:Number(b.balance||0),
      customers:Number(b.customers||0),
      debtors:Number(b.debtors||0),
      creditors:Number(b.creditors||0),
      zero:Number(b.zero||0)
    };
  });
  data.top10=(data.top10||[]).map(c=>({
    ...c,
    customer:c.customer||c.Customer||'',
    branch:c.branch||c.Branch||'',
    debit:Number(c.debit||c.Debit||0),
    credit:Number(c.credit||c.Credit||0),
    balance:Number(c.balance||c.Balance||0)
  }));
  if(!data.kpis)data.kpis={};
  data.kpis['Total Debit']=Number(data.kpis['Total Debit']||0);
  data.kpis['Total Credit']=Number(data.kpis['Total Credit']||0);
  data.kpis['Net Outstanding']=Number(data.kpis['Net Outstanding']||0);
  data.kpis['Total Customers']=Number(data.kpis['Total Customers']||data.customers.length||0);
  data.kpis['Debtors']=Number(data.kpis['Debtors']||data.customers.filter(c=>c.Status==='Debtor').length||0);
  data.kpis['Creditors']=Number(data.kpis['Creditors']||data.customers.filter(c=>c.Status==='Creditor').length||0);
  data.kpis['Zero Balance']=Number(data.kpis['Zero Balance']||data.customers.filter(c=>c.Status==='Zero').length||0);
  data.kpis['Last Updated']=data.kpis['Last Updated']||new Date().toISOString();
  if(!data.trend)data.trend=[];
  return data;
}

async function loadData(options={}){
  const silent = options.silent === true;
  SYNC_STATE='refreshing';
  updateStatus();
  if(!silent){
    setLoadingState(true, ia()?'جاري جلب البيانات من Google Drive':'Fetching data from Google Drive', ia()?'يتم الآن تحديث بيانات مديونيات العملاء من ملفات الفروع المرتبطة...':'Updating customer receivables from the connected branch files...', false);
  }
  if(CFG.URL&&!CFG.DEMO){
    try{
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),30000);
      const r=await fetch(CFG.URL + (CFG.URL.includes('?')?'&':'?') + 'ts=' + Date.now(), {cache:'no-store',signal:controller.signal});
      clearTimeout(timeout);
      if(!r.ok) throw new Error('HTTP '+r.status);
      RAW=normalizeLiveData(await r.json());
      LAST_REFRESH_TIME=new Date();
      SYNC_STATE='connected';
    }catch(e){
      console.error('Live data failed:', e);
      SYNC_STATE='failed';
      if(!RAW){
        // First load failed — show error state
        if(!silent){
          setLoadingState(true, ia()?'فشل الاتصال':'Connection Failed', ia()?'تعذر جلب البيانات من Google Drive':'Could not fetch data from Google Drive', true);
        }
        RAW=genDemo();CFG.DEMO=true;LAST_REFRESH_TIME=new Date();
      } else {
        // Already have data, just show toast
        toast(ia()?'⚠️ فشل التحديث — البيانات السابقة معروضة':'⚠️ Refresh failed — showing cached data');
      }
    }
  } else {RAW=genDemo();LAST_REFRESH_TIME=new Date();SYNC_STATE=CFG.DEMO?'idle':'connected';}
  if(!RAW.trend)RAW.trend=[];
  FILT=[...RAW.customers];PAGE=1;populateBranchFilter();renderAll();
  if(!silent){
    setTimeout(()=>setLoadingState(false), 450);
  }
  updateStatus();
}

async function refreshData(silent=false){
  SYNC_STATE='refreshing';
  updateStatus();
  if(!silent) setLoadingState(true, ia()?'جاري تحديث البيانات من Google Drive':'Refreshing data from Google Drive', ia()?'يتم تحديث قاعدة البيانات والرسوم البيانية الآن...':'Refreshing the database, KPIs and charts now...', false);
  if(CFG.URL&&!CFG.DEMO){
    try{
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),30000);
      await fetch(CFG.URL+'?action=refresh&ts='+Date.now(), {cache:'no-store',signal:controller.signal});

function sortBy(col){if(SORT.col===col)SORT.asc=!SORT.asc;else{SORT.col=col;SORT.asc=false;}PAGE=1;renderCustomers();}

function calcRisk(c){
  if(c.Balance<=0)return 0;
  let score=0;
  // Balance magnitude (max 40 points)
  const maxBal=RAW.top10[0]?.balance||1;
  score+=Math.min(40,Math.round((c.Balance/maxBal)*40));
  // Aging (max 40 points)
  if(c.Aging==='90+')score+=40;else if(c.Aging==='61-90')score+=30;else if(c.Aging==='31-60')score+=20;else if(c.Aging==='1-30')score+=10;
  // Days since (max 20 points)
  score+=Math.min(20,Math.round((c.DaysSince||0)/180*20));
  return Math.min(100,score);
}

  h+='<div style="background:rgba(255,255,255,.02);padding:8px 10px;border-radius:6px"><div style="font-size:8px;color:var(--t3)">'+t('credit')+'</div><div style="font-weight:700">'+fS(c.Credit)+'</div></div>';
  h+='<div style="background:rgba(255,255,255,.02);padding:8px 10px;border-radius:6px"><div style="font-size:8px;color:var(--t3)">'+t('balance')+'</div><div style="font-weight:800;font-size:16px;color:'+balCol+'">'+fS(c.Balance)+'</div></div>';
  h+='<div style="background:rgba(255,255,255,.02);padding:8px 10px;border-radius:6px"><div style="font-size:8px;color:var(--t3)">'+t('risk')+'</div><div><span class="bg '+riskCls+'">'+riskTxt+' ('+rs+')</span></div></div>';
  h+='<div style="background:rgba(255,255,255,.02);padding:8px 10px;border-radius:6px"><div style="font-size:8px;color:var(--t3)">'+t('aging')+'</div><div>'+(c.Aging||'—')+'</div></div>';
  h+='<div style="background:rgba(255,255,255,.02);padding:8px 10px;border-radius:6px"><div style="font-size:8px;color:var(--t3)">'+(a?'أيام بدون سداد':'Days Since Payment')+'</div><div>'+(c.DaysSince||0)+'</div></div>';
  h+='</div>';
  document.getElementById('modalC').innerHTML=h;document.getElementById('modalOv').classList.add('vis');
}
function bg(cls,txt){return '<span class="bg '+cls+'">'+txt+'</span>'; }
function bg2(cls,txt){return bg(cls,txt);}

// ═══ REPORTS ═══
function copyCEO(){
  const d=RAW,k=d.kpis,a=ia();
  const date=new Date().toLocaleDateString(a?'ar-SA':'en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const collRate=k['Total Debit']>0?Math.round((k['Total Credit']/k['Total Debit'])*100):0;
  const brSorted=[...d.branches].sort((x,y)=>y.balance-x.balance);
  const totalAR=k['Net Outstanding'];

  let r='══════════════════════════\n📊 '+t('ceoTitle')+'\n📅 '+date+'\n══════════════════════════\n\n';
  r+='💰 '+t('netBal')+': '+fS(totalAR)+'\n📊 '+t('totalDebit')+': '+fS(k['Total Debit'])+'\n📉 '+t('totalCredit')+': '+fS(k['Total Credit'])+'\n📈 '+t('collRate')+': '+collRate+'%\n👥 '+t('totalCust')+': '+fm(k['Total Customers'])+'\n🔴 '+t('debtors')+': '+fm(k['Debtors'])+'\n⚪ '+t('zeroBal')+': '+fm(k['Zero Balance'])+'\n🟢 '+t('creditors')+': '+fm(k['Creditors'])+'\n\n';
  r+='━━ '+t('branchAR')+' ━━\n';
  brSorted.forEach((b,i)=>{const pct=Math.round((Math.max(b.balance,0)/Math.max(totalAR,1))*100);r+=(i+1)+'. '+(a?b.branch:b.branchEn)+': '+fS(b.balance)+' ('+pct+'%)\n';});
  r+='\n━━ '+t('top10')+' ━━\n';
  d.top10.forEach((c,i)=>{r+=(i+1)+'. '+c.customer+': '+fS(c.balance)+'\n';});
  // Aging summary
  const ag={current:0,'1-30':0,'31-60':0,'61-90':0,'90+':0};
  RAW.customers.filter(c=>c.Balance>0).forEach(c=>{ag[c.Aging||'current']+=c.Balance;});
  r+='\n━━ '+t('aging')+' ━━\n';
  r+=t('current')+': '+fS(ag.current)+'\n'+t('d30')+': '+fS(ag['1-30'])+'\n'+t('d60')+': '+fS(ag['31-60'])+'\n'+t('d90')+': '+fS(ag['61-90'])+'\n'+t('over90')+': '+fS(ag['90+'])+'\n';
  // Alerts
  const over90=RAW.customers.filter(c=>c.Aging==='90+'&&c.Balance>0);
  if(over90.length){r+='\n⚠️ '+(a?'تنبيهات':'Alerts')+':\n';r+='🔴 '+over90.length+(a?' عميل بمديونية متقادمة > 90 يوم':' customers with aged AR > 90 days')+'\n';}
  r+='\n══════════════════════════\nHavana Textiles — AR Dashboard\n';
  navigator.clipboard.writeText(r).then(()=>toast('copied'));
}

function copyBranchReport(){
  const d=RAW,a=ia();const br=document.getElementById('fBr').value;
  const date=new Date().toLocaleDateString(a?'ar-SA':'en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  let custs=br==='all'?RAW.customers:RAW.customers.filter(c=>c.Branch===br);
  const brName=br==='all'?(a?'جميع الفروع':'All Branches'):(a?br:(RAW.branches.find(b=>b.branch===br)?.branchEn||br));
  const tD=custs.reduce((s,c)=>s+c.Debit,0),tC=custs.reduce((s,c)=>s+c.Credit,0);
  let r='🏢 '+(a?'تقرير فرع':'Branch Report')+': '+brName+'\n📅 '+date+'\n━━━━━━━━\n\n';
  r+='💰 '+t('netBal')+': '+fS(tD-tC)+'\n👥 '+t('totalCust')+': '+custs.length+'\n🔴 '+t('debtors')+': '+custs.filter(c=>c.Status==='Debtor').length+'\n\n';
  r+='━━ '+(a?'أكبر العملاء':'Top Customers')+' ━━\n';
  [...custs].filter(c=>c.Balance>0).sort((a,b)=>b.Balance-a.Balance).slice(0,10).forEach((c,i)=>{r+=(i+1)+'. '+c.Customer+': '+fS(c.Balance)+'\n';});
  r+='\n━━━━━━━━\n';
  navigator.clipboard.writeText(r).then(()=>toast('copied'));
}

function exportCSV(){
  const a=ia();const headers=[t('branch'),t('customer'),t('debit'),t('credit'),t('balance'),t('status'),t('aging')];
  let csv=headers.join(',')+'\n';
  FILT.forEach(c=>{csv+='"'+(a?c.Branch:c.Branch_En)+'","'+c.Customer+'",'+c.Debit+','+c.Credit+','+c.Balance+',"'+(c.Status==='Debtor'?t('debtor'):c.Status==='Creditor'?t('creditor'):t('zero'))+'","'+(c.Aging||'')+'"\n';});
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const el=document.createElement('a');el.href=url;el.download='havana_ar_'+new Date().toISOString().slice(0,10)+'.csv';el.click();URL.revokeObjectURL(url);toast('copied');
}

const TABS=[{id:'overview',k:'overview'},{id:'branches',k:'branches'},{id:'customers',k:'customersTab'},{id:'risk',k:'riskTab'},{id:'trends',k:'trends'},{id:'alerts',k:'alerts'}];

function buildTabs(){document.getElementById('tabBar').innerHTML=TABS.map(tb=>'<button class="tab'+(tb.id===SEC?' act':'')+'" onclick="goTab(\''+tb.id+'\')">'+t(tb.k)+'</button>').join('');}
function goTab(id){SEC=id;document.querySelectorAll('.sec').forEach(el=>el.classList.remove('act'));document.getElementById('sec-'+id).classList.add('act');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('act',false));document.querySelectorAll('.tab').forEach(b=>{if(b.textContent===t(TABS.find(tb=>tb.id===id)?.k))b.classList.add('act');});renderSec(id);}

function setLang(lg){L=lg;document.documentElement.lang=lg;document.documentElement.dir=lg==='ar'?'rtl':'ltr';document.getElementById('lA').classList.toggle('act',lg==='ar');document.getElementById('lE').classList.toggle('act',lg==='en');document.getElementById('hSub').textContent=t('sub');document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t);});document.querySelectorAll('[data-t-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.tPlaceholder||el.getAttribute('data-t-placeholder'));});
  // Update auto-refresh label
  const arLabel=document.getElementById('arLabel');
  if(arLabel) arLabel.textContent=AUTO_REFRESH_ON?(ia()?'تلقائي':'Auto'):(ia()?'متوقف':'Off');
  if(RAW){populateBranchFilter();buildTabs();renderAll();}if(typeof Chart!=='undefined')Chart.defaults.font.family=cf();}

function updateStatus(){
  const dot=document.getElementById('sDot');const txt=document.getElementById('sText');
  // Sync state dot
  if(SYNC_STATE==='refreshing'){dot.className='status-dot';dot.style.background='var(--am)';dot.style.boxShadow='0 0 6px var(--am)';}
  else if(SYNC_STATE==='failed'){dot.className='status-dot off';}
  else if(SYNC_STATE==='connected'||!CFG.DEMO){dot.className='status-dot on';}
  else{dot.className='status-dot off';}

  const source = CFG.DEMO ? t('demoMode') : (ia()?'بيانات حية من Google Drive':'Live from Google Drive');
  const last = LAST_REFRESH_TIME ? fmtTime(LAST_REFRESH_TIME) : ((RAW?.kpis?.['Last Updated']||'').slice(11,16));
  const syncLabel = SYNC_STATE==='refreshing'?(ia()?'جاري التحديث...':'Refreshing...'):SYNC_STATE==='failed'?(ia()?'فشل الاتصال':'Connection failed'):(ia()?'متصل':'Connected');
  const syncCls = SYNC_STATE==='refreshing'?'refreshing':SYNC_STATE==='failed'?'failed':'';
  const arInfo = AUTO_REFRESH_ON ? '' : (' · '+(ia()?'التحديث التلقائي متوقف':'Auto refresh paused'));
  txt.innerHTML='<span class="sync-pill '+syncCls+'"><span class="mini-dot"></span>'+syncLabel+'</span> · '+source+' · '+t('lastUpdate')+': '+last+' · '+FILT.length+' '+t('customers')+arInfo;
}
